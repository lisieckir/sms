server {
    listen 80;
    server_name sms.mikr.us;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sms.mikr.us;

    ssl_certificate     /etc/ssl/sms.mikr.us/fullchain.pem;
    ssl_certificate_key /etc/ssl/sms.mikr.us/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/sms/app/public;
    index index.php;

    access_log  /var/log/nginx/sms.access.log;
    error_log   /var/log/nginx/sms.error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   unix:/run/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT    $realpath_root;
        fastcgi_param  SERVER_NAME      $host;
        fastcgi_param  APP_ENV          prod;
        fastcgi_param  APP_DEBUG        0;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(var|config|src|vendor|translations|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
