services:
  php:
    build:
      context: docker/php
    security_opt:
      - label=disable
    volumes:
      - ./app:/app
    environment:
      APP_ENV: dev
      POCKETBASE_URL: http://pocketbase:8090
      MAILER_DSN: smtp://mailpit:1025
      APP_SECRET: change_this_in_production
    depends_on:
      - pocketbase

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/app:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - php

  pocketbase:
    build:
      context: docker/pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pb_data:
