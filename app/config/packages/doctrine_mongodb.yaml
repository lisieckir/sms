doctrine_mongodb:
    auto_generate_proxy_classes: true
    auto_generate_hydrator_classes: true
    connections:
        default:
            server: '%env(MONGODB_URI)%'
            options: {}
    default_database: '%env(MONGODB_DB)%'
    document_managers:
        default:
            auto_mapping: false
            mappings:
                IdentityAccess:
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/IdentityAccess/Infrastructure/Doctrine'
                    prefix: 'App\IdentityAccess\Infrastructure\Doctrine'
                TaskManagement:
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/TaskManagement/Infrastructure/Doctrine'
                    prefix: 'App\TaskManagement\Infrastructure\Doctrine'
                ClientManagement:
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/ClientManagement/Infrastructure/Doctrine'
                    prefix: 'App\ClientManagement\Infrastructure\Doctrine'
                BoardManagement:
                    is_bundle: false
                    dir: '%kernel.project_dir%/src/BoardManagement/Infrastructure/Doctrine'
                    prefix: 'App\BoardManagement\Infrastructure\Doctrine'

when@prod:
    doctrine_mongodb:
        auto_generate_proxy_classes: false
        auto_generate_hydrator_classes: false
        document_managers:
            default:
                metadata_cache_driver:
                    type: service
                    id: doctrine_mongodb.system_cache_pool

    framework:
        cache:
            pools:
                doctrine_mongodb.system_cache_pool:
                    adapter: cache.system
